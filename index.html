<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мамин Ритм</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #f8f9fa;
            --tg-theme-text-color: #333333;
            --tg-theme-button-color: #a3c9b5; /* Мятный */
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--tg-theme-bg-color, #f8f9fa); 
            color: var(--tg-theme-text-color, #333); 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #556b2f; }
        p { font-size: 14px; color: #777; margin-bottom: 25px; }
        label { display: block; text-align: left; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            box-sizing: border-box;
            font-size: 16px;
        }
        button { 
            background-color: var(--tg-theme-button-color, #a3c9b5); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Мамин Ритм</h1>
        <p>Давайте познакомимся! Введите данные, чтобы я могла подстроиться под ваш ритм.</p>

        <label>Имя малыша</label>
        <input type="text" id="childName" placeholder="Например, Саша">

        <label>Дата рождения</label>
        <input type="date" id="birthDate">

        <button onclick="saveData()">Начать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        function saveData() {
            const name = document.getElementById('childName').value;
            const date = document.getElementById('birthDate').value;

            if (!name || !date) {
                tg.showAlert("Пожалуйста, заполните все поля.");
                return;
            }

            // Отправляем данные боту
            const data = { name: name, date: date };
            
            // В Telegram Web App данные передаются через закрытие окна
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
