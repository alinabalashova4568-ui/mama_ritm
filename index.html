<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мамин Ритм</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f8f9fa; 
            color: #333; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #556b2f; }
        p { font-size: 14px; color: #777; margin-bottom: 25px; }
        label { display: block; text-align: left; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            box-sizing: border-box;
            font-size: 16px;
        }
        button { 
            background-color: #a3c9b5; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: opacity 0.2s;
            margin-bottom: 10px;
        }
        button:active { opacity: 0.8; }
        
        /* Стили для Дашборда */
        .dashboard-btn {
            background-color: #e6f0ea;
            color: #556b2f;
            border: 2px solid #a3c9b5;
            text-align: left;
            padding: 20px;
            font-size: 18px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: АНКЕТА -->
    <div class="card" id="formScreen">
        <h1>Мамин Ритм</h1>
        <p>Давайте познакомимся! Введите данные, чтобы я могла подстроиться под ваш ритм.</p>

        <label>Имя малыша</label>
        <input type="text" id="childName" placeholder="Например, Саша">

        <label>Дата рождения</label>
        <input type="date" id="birthDate">

        <button onclick="saveData()">Начать</button>
    </div>

    <!-- ЭКРАН 2: ДАШБОРД (Скрыт по умолчанию) -->
    <div class="card hidden" id="dashboardScreen">
        <h1>Привет, мама! 👋</h1>
        <p id="babyInfo">Данные загружаются...</p>

        <button class="dashboard-btn" onclick="soon()">😴 Сон и бодрствование</button>
        <button class="dashboard-btn" onclick="soon()">🥄 Прикорм и кормление</button>
        <button class="dashboard-btn" onclick="soon()">📔 Дневник достижений</button>
        <button class="dashboard-btn" onclick="soon()">🥗 Забота о маме</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function saveData() {
            const name = document.getElementById('childName').value;
            const date = document.getElementById('birthDate').value;

            if (!name || !date) {
                tg.showAlert("Пожалуйста, заполните все поля.");
                return;
            }

            const data = { name: name, date: date };
            
            // Отправляем данные на сервер
            fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(response => {
                if (response.ok) {
                    // Прячем анкету, показываем Дашборд
                    document.getElementById('formScreen').classList.add('hidden');
                    document.getElementById('dashboardScreen').classList.remove('hidden');
                    
                    // Меняем текст на дашборде
                    document.getElementById('babyInfo').innerText = `Профиль малыша ${name} сохранен.`;
                } else {
                    tg.showAlert("Ошибка при сохранении.");
                }
            }).catch(err => {
                tg.showAlert("Ошибка сети: " + err);
            });
        }

        function soon() {
            tg.showAlert("Эта функция появится в следующем обновлении! 🚀");
        }
    </script>
</body>
</html>
