<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мамин Ритм</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f8f9fa; 
            color: #333; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #556b2f; }
        p { font-size: 14px; color: #777; margin-bottom: 25px; }
        label { display: block; text-align: left; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            box-sizing: border-box;
            font-size: 16px;
        }
        button { 
            background-color: #a3c9b5; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: opacity 0.2s;
            margin-bottom: 10px;
        }
        button:active { opacity: 0.8; }
        
        .dashboard-btn {
            background-color: #e6f0ea;
            color: #556b2f;
            border: 2px solid #a3c9b5;
            text-align: left;
            padding: 20px;
            font-size: 18px;
        }
        .hidden { display: none; }
        
        /* Стили для списка достижений */
        .achievement-item {
            background: #f4f9f6;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            text-align: left;
            border-left: 4px solid #a3c9b5;
        }
        .achievement-date { font-size: 12px; color: #888; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: АНКЕТА -->
    <div class="card" id="formScreen">
        <h1>Мамин Ритм</h1>
        <p>Давайте познакомимся! Введите данные, чтобы я могла подстроиться под ваш ритм.</p>

        <label>Имя малыша</label>
        <input type="text" id="childName" placeholder="Например, Саша">

        <label>Дата рождения</label>
        <input type="date" id="birthDate">

        <button onclick="saveData()">Начать</button>
    </div>

    <!-- ЭКРАН 2: ДАШБОРД -->
    <div class="card hidden" id="dashboardScreen">
        <h1>Привет, мама! 👋</h1>
        <p id="babyInfo">Данные загружаются...</p>

        <button class="dashboard-btn" onclick="soon()">😴 Сон и бодрствование</button>
        <button class="dashboard-btn" onclick="soon()">🥄 Прикорм и кормление</button>
        <button class="dashboard-btn" onclick="showDiary()">📔 Дневник достижений</button>
        <button class="dashboard-btn" onclick="soon()">🥗 Забота о маме</button>
    </div>

    <!-- ЭКРАН 3: ДНЕВНИК ДОСТИЖЕНИЙ -->
    <div class="card hidden" id="diaryScreen">
        <h1>📔 Достижения</h1>
        <p>Записывайте самые важные моменты!</p>
        
        <input type="text" id="achievementText" placeholder="Что случилось? (например, Первый зуб)">
        <button onclick="addAchievement()">Сохранить</button>
        
        <div id="achievementsList" style="margin-top: 20px;">
            <!-- Сюда будут добавляться записи -->
        </div>

        <button onclick="backToDashboard()" style="background-color: #ccc; margin-top: 20px;">Назад</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let currentBabyName = "";

        function saveData() {
            const name = document.getElementById('childName').value;
            const date = document.getElementById('birthDate').value;

            if (!name || !date) {
                tg.showAlert("Пожалуйста, заполните все поля.");
                return;
            }

            currentBabyName = name;
            const data = { name: name, date: date };
            
            fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(response => {
                if (response.ok) {
                    document.getElementById('formScreen').classList.add('hidden');
                    document.getElementById('dashboardScreen').classList.remove('hidden');
                    document.getElementById('babyInfo').innerText = `Профиль малыша ${name} сохранен.`;
                }
            });
        }

        function soon() {
            tg.showAlert("Эта функция появится в следующем обновлении! 🚀");
        }

        function showDiary() {
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('diaryScreen').classList.remove('hidden');
            loadAchievements();
        }

        function backToDashboard() {
            document.getElementById('diaryScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
        }

        function addAchievement() {
            const text = document.getElementById('achievementText').value;
            if (!text) return;

            fetch('/api/add_achievement', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ baby_name: currentBabyName, text: text })
            }).then(() => {
                document.getElementById('achievementText').value = '';
                loadAchievements();
            });
        }

        function loadAchievements() {
            fetch(`/api/get_achievements?baby_name=${currentBabyName}`)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('achievementsList');
                    list.innerHTML = '';
                    if (data.length === 0) {
                        list.innerHTML = '<p style="font-size:12px; color:#999;">Пока нет записей.</p>';
                    }
                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'achievement-item';
                        div.innerHTML = `<strong>${item.text}</strong><br><span class="achievement-date">${item.date}</span>`;
                        list.appendChild(div);
                    });
                });
        }
    </script>
</body>
</html>
